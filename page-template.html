<!doctype html>
<html lang="tr" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench</title>
<meta name="description" content="Workbench: tasarım araçları ve bileşen hattı için çalışma alanı.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E8EBF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2227" media="(prefers-color-scheme: dark)">
<link rel="preload" href="./fonts/josefin-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./styles.css">
<script src="./theme.mjs"></script>
<script type="module" src="./app.mjs"></script>
</head>
<body>
<a class="skip-link" href="#app-penpot">Uygulamalara geç</a>
<header class="bar bar--top">
  <svg class="mark" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="2.5" class="mark-a"/><rect x="13" y="2" width="9" height="9" rx="4.5" class="mark-b"/><rect x="2" y="13" width="9" height="9" rx="4.5" class="mark-b"/><rect x="13" y="13" width="9" height="9" rx="2.5" class="mark-a"/></svg>
  <h1 class="brand">Workbench</h1>
  <button type="button" class="theme js-only" id="theme" aria-label="Koyu temaya geç">
    <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
  </button>
</header>

<main id="main" class="content">
  <nav aria-label="Uygulamalar" class="groups" id="app-groups">
    <section class="group" data-group="design" aria-labelledby="h-design">
      <div class="group-head">
        <span class="group-num" aria-hidden="true">01</span>
        <h2 id="h-design" class="group-title">Tasarım</h2>
        <span class="group-count" data-count="design">{{count:design}}</span>
      </div>
      <div class="grid-clip"><div class="grid">{{tiles:design}}</div></div>
    </section>

    <hr class="divider" data-divider>

    <section class="group" data-group="comp" aria-labelledby="h-comp">
      <div class="group-head">
        <span class="group-num" aria-hidden="true">02</span>
        <h2 id="h-comp" class="group-title">Bileşen hattı</h2>
        <span class="group-count" data-count="comp">{{count:comp}}</span>
      </div>
      <div class="pipeline" aria-hidden="true">
        <span class="step"><span class="dot"></span>Beta</span><span class="rail"></span>
        <span class="step"><span class="dot dot--on"></span>RC</span><span class="rail"></span>
        <span class="step"><span class="dot dot--on"></span>Kütüphane</span>
      </div>
      <div class="grid-clip"><div class="grid">{{tiles:comp}}</div></div>
    </section>
  </nav>

  <div class="empty" id="empty" role="status" hidden>
    <p class="empty-title">Eşleşen uygulama yok</p>
    <button type="button" class="btn" id="empty-clear">Aramayı temizle</button>
  </div>
  <p class="sr-only" id="search-help">Ad, kullanım amacı, grup veya adresle filtrele. Escape aramayı temizler; Enter ilk sonuca geçer.</p>
  <noscript><p class="fallback-note">Arama ve tema seçimi için JavaScript gerekir. Uygulama bağlantıları doğrudan açılabilir.</p></noscript>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>

<footer class="bar bar--bottom js-only">
  <div class="tabs" role="group" aria-label="Grup">
    <button type="button" class="tab" data-seg="all" aria-pressed="true"><span>Tümü</span><span class="tab-n" data-n="all">{{count:all}}</span></button>
    <button type="button" class="tab" data-seg="design" aria-pressed="false"><span>Tasarım</span><span class="tab-n" data-n="design">{{count:design}}</span></button>
    <button type="button" class="tab" data-seg="comp" aria-pressed="false"><span>Bileşen</span><span class="tab-n" data-n="comp">{{count:comp}}</span></button>
  </div>
  <div class="search" role="search">
    <label for="q" class="sr-only">Uygulama ara</label>
    <svg class="search-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Uygulama, grup veya adres" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" maxlength="160" aria-controls="app-groups" aria-describedby="search-help">
    <button type="button" class="clear" id="clear" aria-label="Aramayı temizle" hidden>
      <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
    </button>
  </div>
</footer>
</body>
</html>
